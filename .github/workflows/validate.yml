name: Build & CSS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        run: npm run build
      - name: CSS
        run: npx --yes -p stylelint@16 -p stylelint-config-standard@38 stylelint "styles/*.css"
