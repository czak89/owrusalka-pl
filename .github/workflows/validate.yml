name: Validate HTML & CSS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: HTML
        run: npx --yes html-validate@9 index.html pokoje.html Rezerwacja.html
      - name: CSS
        run: npx --yes -p stylelint@16 -p stylelint-config-standard@38 stylelint "*.css"
