<!-- @dsCard group="Components" height=180 subtitle="Default, focused, error · checkboxes" -->
<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8">
<title>Form inputs</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow:hidden}
  body { padding: 20px 24px; background: var(--c-paper); }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--c-deep-sea); }
  .field { background: var(--c-paper-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; font-family: var(--font-body); font-size: 16px; color: var(--c-deep-sea); height: 44px; display: flex; align-items: center; }
  .field.focused { border-color: var(--focus-ring); outline: 2px solid var(--focus-ring); outline-offset: 2px; background: var(--c-paper); }
  .field.error   { border-color: var(--error); background: var(--error-surface); color: var(--fg); }
  .field input { all: unset; flex: 1; }
  .field .placeholder { color: var(--fg-3); }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 14px; color: var(--fg); }
  .check .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--c-deep-sea); background: var(--c-paper-2); display: inline-flex; align-items: center; justify-content: center; }
  .check.checked .box { background: var(--primary); border-color: var(--primary); }
  .check.checked .box svg { color: var(--on-accent); }
  .helper { font-size: 12px; font-weight: 500; color: var(--fg-3); margin-top: 2px; }
  .helper.err { color: var(--error); font-weight: 700; }
</style>
</head><body>
  <div class="row">
    <label>Imię i nazwisko<div class="field"><input value="Anna Kowalska"></div></label>
    <label>Liczba osób<div class="field focused">2 dorosłych + 1 dziecko</div></label>
    <label>E-mail<div class="field error">anna@</div><div class="helper err">Podaj pełny adres e-mail.</div></label>
  </div>
  <div style="display:flex; gap:18px; margin-top: 12px">
    <div class="check checked"><span class="box"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span> Pełne wyżywienie</div>
    <div class="check"><span class="box"></span> Łóżeczko turystyczne</div>
    <div class="check"><span class="box"></span> Pies w pokoju</div>
  </div>
</body></html>
