<!-- @dsCard group="Type" height=265 subtitle="Card padding and vertical rhythm in one panel" -->
<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8">
<title>Spacing in use — layout rhythm</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow:hidden}
  body { padding: 18px 22px; background: var(--c-paper); }
  .panel { background: var(--c-paper-2); border-radius: var(--radius-lg); padding: 24px 28px; box-shadow: var(--shadow-md); position: relative; }
  .eyebrow { font-family: var(--font-body); font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-text); margin: 0 0 12px; }
  .h { font-family: var(--font-display); font-weight: 600; font-size: 26px; color: var(--c-deep-sea); margin: 0 0 8px; letter-spacing:-0.01em; }
  .p { font-family: var(--font-body); font-size: 16px; color: var(--fg-2); line-height: 1.55; margin: 0 0 16px; max-width: 460px; }
  .row { display: flex; gap: 12px; }
  .btn { font-family: var(--font-body); font-weight: 700; font-size: 14px; border: 0; padding: 10px 18px; border-radius: var(--radius-pill); }
  .cta { background: var(--action); color: var(--on-accent); }
  .gh  { background: transparent; color: var(--c-deep-sea); border: 1.5px solid var(--c-deep-sea); padding: 8.5px 16.5px; }
  .ruler { position: absolute; right: 14px; top: 14px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; color: var(--fg-3); }
</style>
</head><body>
  <div class="panel">
    <div class="ruler">padding 24/28 · gaps 8 → 16</div>
    <div class="eyebrow">Sezon 2026</div>
    <h2 class="h">Rezerwacje już otwarte.</h2>
    <p class="p">Najtańsze terminy w czerwcu i wrześniu. Dla rodzin z dziećmi — programy animacyjne w lipcu i sierpniu.</p>
    <div class="row">
      <button class="btn cta">Zarezerwuj</button>
      <button class="btn gh">Cennik 2026</button>
    </div>
  </div>
</body></html>
