<?xml version="1.0"?>

<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 900 280" xml:space="preserve">
  <defs>
    
  </defs>
  
  
  <rect fill="#003B59" x="0" y="0" width="500" height="54"></rect>
